# Pings the live match-refresh pipeline every 20 minutes
# (docs/live-match-refresh-plan.md). Free on public repos.
#
# Requires the CRON_SECRET repository secret (GitHub → Settings →
# Secrets and variables → Actions) — same value as the Vercel env var.
#
# The step fails on any non-200 response, so GitHub emails you if the
# pipeline ever starts erroring. Off-season runs are no-ops (the route
# exits instantly when no tournament is in its window).

name: Refresh matches

on:
  schedule:
    - cron: "*/20 * * * *" # every 20 minutes, UTC
  workflow_dispatch: # adds a manual "Run workflow" button in the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping the refresh endpoint
        run: |
          curl --fail-with-body --silent --show-error --max-time 280 \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://courtside-net.vercel.app/api/cron/refresh-matches"
